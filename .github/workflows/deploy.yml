name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Server and Update
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/Araksha-smart-disaster-relief-backend 
            
            # 2. අලුත් code එක GitHub එකෙන් ගන්න
            git pull origin dev
            
            # 3. App එක Build කරන්න 
            ./mvnw clean package -DskipTests
            
            # 4. දැනට Run වෙවී තියෙන පරණ Spring Boot App එක නවත්වන්න
            pkill -f 'java -jar' || true
            
            # 5. අලුතින් හැදුනු Jar ෆයිල් එක Background එකේ Run කරන්න (Jar නම වෙනස් කරන්න)
            nohup java -jar target/Araksha-smart-disaster-relief-backend-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
